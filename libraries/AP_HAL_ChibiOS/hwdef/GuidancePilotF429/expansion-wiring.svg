<line x1="240" y1="266" x2="275" y2="266" stroke="#185b80" stroke-width="3" />
<text x="285" y="272" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#185b80">IMU_CS</text>
