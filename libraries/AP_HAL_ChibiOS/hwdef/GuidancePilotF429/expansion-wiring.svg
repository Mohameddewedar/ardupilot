<text x="522" y="536" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#17243b">* Only after unpowered check: carrier must not drive FSYNC.</text>
<rect x="1000" y="110" width="475" height="445" rx="6" fill="#f6f9fc" stroke="#a7b7c8" stroke-width="2"/>
<text x="1016" y="139" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#17243b">HW-125 • six-contact microSD reader</text>
<text x="1016" y="163" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#17243b">Back face up; header LEFT; top → bottom</text>
<text x="1016" y="190" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#17243b">1 CS</text>
<line x1="1215" y1="184" x2="1250" y2="184" stroke="#185b80" stroke-width="3" />
<text x="1260" y="190" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#185b80">SD_CS</text>
<text x="1016" y="244" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#17243b">2 SCK</text>
<line x1="1215" y1="238" x2="1250" y2="238" stroke="#185b80" stroke-width="3" />
<text x="1260" y="244" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#185b80">SD_SCK</text>
<text x="1016" y="298" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#17243b">3 MOSI</text>
<line x1="1215" y1="292" x2="1250" y2="292" stroke="#185b80" stroke-width="3" />
<text x="1260" y="298" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#185b80">SD_MOSI</text>
<text x="1016" y="352" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#17243b">4 MISO</text>
<line x1="1215" y1="346" x2="1250" y2="346" stroke="#185b80" stroke-width="3" />
<text x="1260" y="352" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#185b80">SD_MISO</text>
<text x="1016" y="406" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#17243b">5 VCC</text>
<line x1="1215" y1="400" x2="1250" y2="400" stroke="#a24a05" stroke-width="3" />
<text x="1260" y="406" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#a24a05">EXT_5V</text>
<text x="1016" y="460" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#17243b">6 GND</text>
<line x1="1215" y1="454" x2="1250" y2="454" stroke="#185b80" stroke-width="3" />
<text x="1260" y="460" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#185b80">GND</text>
<text x="1017" y="514" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#17243b">5 V VCC → onboard LDO → 3.3 V card supply; verify.</text>
<text x="1017" y="536" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#17243b">Check output under load; SPI signals remain 3.3 V.</text>
<rect x="25" y="585" width="450" height="245" rx="6" fill="#f6f9fc" stroke="#a7b7c8" stroke-width="2"/>
<text x="41" y="614" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#17243b">GPS MINI V1.0 • NEO-7N</text>
<text x="41" y="638" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#17243b">Battery/component face up; header BOTTOM</text>
<text x="42" y="657" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#17243b">Contacts left → right:</text>
<text x="41" y="689" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#17243b">1 PPS</text>
<line x1="240" y1="683" x2="275" y2="683" stroke="#185b80" stroke-width="3" />
<text x="285" y="689" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#185b80">NC (leave open)</text>
<text x="41" y="717" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#17243b">2 RXD</text>
<line x1="240" y1="711" x2="275" y2="711" stroke="#185b80" stroke-width="3" />
<text x="285" y="717" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#185b80">GPS_RX  ←</text>
<text x="41" y="745" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#17243b">3 TXD</text>
<line x1="240" y1="739" x2="275" y2="739" stroke="#185b80" stroke-width="3" />
<text x="285" y="745" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#185b80">GPS_TX  →</text>
<text x="41" y="773" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#17243b">4 GND</text>
<line x1="240" y1="767" x2="275" y2="767" stroke="#185b80" stroke-width="3" />
<text x="285" y="773" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#185b80">GND</text>
<text x="41" y="801" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#17243b">5 VCC</text>
<line x1="240" y1="795" x2="275" y2="795" stroke="#a24a05" stroke-width="3" />
<text x="285" y="801" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#a24a05">EXT_3V3</text>
<rect x="505" y="585" width="970" height="245" rx="6" fill="#f6f9fc" stroke="#a7b7c8" stroke-width="2"/>
<text x="521" y="614" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#17243b">Separate SPI buses and supply</text>
<text x="521" y="638" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#17243b">Matching signal net names connect; SPI4 and SPI5 clock/data nets remain separate.</text>
<text x="525" y="667" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#185b80">SPI4 → IMU 3 / 4 / 7</text>
<text x="525" y="695" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17243b">P1-15 / 11 / 14</text>
<text x="525" y="731" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#185b80">SPI5 → HW-125 2 / 3 / 4</text>
<text x="525" y="759" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17243b">P2-6 / 8 / 5</text>
<text x="525" y="798" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#17243b">SPI5: onboard gyro and LCD connected; no active gyro backend.</text>
<text x="1010" y="665" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17243b">GND: P1, all carrier grounds and</text>
<text x="1010" y="687" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17243b">external supply return share one net.</text>
<text x="1010" y="724" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#a24a05">EXT_3V3 → IMU 1 / GPS 5.</text>
<text x="1010" y="750" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#b42318">EXT_5V → HW-125 5 VCC.</text>
<text x="1010" y="772" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#b42318">Neither rail connects to Discovery 3V / 5V.</text>
<rect x="25" y="845" width="1450" height="250" rx="6" fill="#f6f9fc" stroke="#a7b7c8" stroke-width="2"/>
<text x="45" y="878" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#17243b">Assembly conditions</text>
<text x="45" y="912" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#17243b">Verify regulator outputs and loaded chip rails before signal connections; all signal logic is 3.3 V only.</text>
<text x="45" y="944" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#17243b">Keep PC1/PC2 high; SD is the only active SPI5 device. Verify MISO release before adding another active SPI5 device.</text>
<text x="45" y="976" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#17243b">AD0 is SDO: no strap. FSYNC → GND after unpowered check. IMU EDA/ECL/INT and GPS PPS: NC (leave open).</text>
<text x="45" y="1008" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#17243b">Discovery stays USB powered. Both external returns join GND; never tie their positive rails to Discovery 3V / 5V.</text>
<text x="45" y="1040" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#17243b">HW-125 VCC is a 5 V regulator input; verify routing and its internal 3.3 V card rail. Never put 5 V on signals.</text>
<text x="45" y="1072" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#17243b">UART direction: P1-43 TX → GPS 2 RXD; GPS 3 TXD → P1-40 RX. See guide for future checks.</text>
</svg>
