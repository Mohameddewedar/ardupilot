<line x1="240" y1="440" x2="275" y2="440" stroke="#185b80" stroke-width="3" />
<text x="285" y="446" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#185b80">GPS_TX  ←</text>
<text x="41" y="475" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#17243b">P1-63 or 64</text>
<line x1="240" y1="469" x2="275" y2="469" stroke="#185b80" stroke-width="3" />
<text x="285" y="475" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#185b80">GND</text>
<text x="42" y="530" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" fill="#17243b">SB22–SB25 stock OFF; SB25 isolates PD2 / LCD IM0.</text>
