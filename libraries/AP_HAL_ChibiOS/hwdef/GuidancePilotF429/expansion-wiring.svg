<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1130" viewBox="0 0 1500 1130" role="img" aria-labelledby="title desc">
<title id="title">GuidancePilotF429 expansion wiring schematic</title>
<desc id="desc">Net-labelled Discovery P1/P2, separate SPI4 IMU and SPI5 SD, and GPS connections. Matching net names are connected. IMU and GPS carrier VCC use recommended external regulated 3.3 volts; the replacement six-contact HW-125 reader VCC uses external regulated 5 volts. All module contacts have an explicit connection or NC disposition. Verify actual rails and 3.3 volt signal levels before connecting signals.</desc>
<rect width="1500" height="1130" fill="white"/>
<text x="30" y="38" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#17243b">GuidancePilotF429 • expansion wiring schematic</text>
<text x="30" y="65" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17243b">Bench only • matching net names connect; NC means leave open • numbers are positional aids</text>
<text x="30" y="90" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#b42318">Recommended: IMU/GPS 3.3 V; HW-125 VCC 5 V. Verify loaded rails; calibration/card tests pending.</text>
<rect x="25" y="110" width="450" height="445" rx="6" fill="#f6f9fc" stroke="#a7b7c8" stroke-width="2"/>
