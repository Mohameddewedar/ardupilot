<line x1="720" y1="422" x2="755" y2="422" stroke="#185b80" stroke-width="3" />
<text x="765" y="428" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#185b80">unused</text>
<text x="521" y="462" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#17243b">9 NCS</text>
<line x1="720" y1="456" x2="755" y2="456" stroke="#185b80" stroke-width="3" />
<text x="765" y="462" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" fill="#185b80">IMU_CS</text>
