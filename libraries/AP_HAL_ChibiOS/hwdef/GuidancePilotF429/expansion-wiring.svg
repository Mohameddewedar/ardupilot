<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1130" viewBox="0 0 1500 1130" role="img" aria-labelledby="title desc">
<title id="title">GuidancePilotF429 expansion signal schematic</title>
<desc id="desc">Net-labelled Discovery P1/P2, separate SPI4 IMU and SPI5 SD, and GPS connections. Matching net names are connected. IMU and GPS VCC are unassigned; SD external 3.3 volt supply is conditional.</desc>
<rect width="1500" height="1130" fill="white"/>
<text x="30" y="38" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#17243b">GuidancePilotF429 • expansion signal schematic</text>
<text x="30" y="65" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17243b">Bench only • matching signal net names connect; unused and HOLD contacts are open • numbers are positional aids</text>
<text x="30" y="90" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#b42318">IMU and GPS VCC: HOLD / UNASSIGNED. SD power is conditional. No powered validation.</text>
<rect x="25" y="110" width="450" height="445" rx="6" fill="#f6f9fc" stroke="#a7b7c8" stroke-width="2"/>
